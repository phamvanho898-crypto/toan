    <div>${detailedSolution(q)}</div>
  </section>`;
}
function openTheoryGroup(groupId){
  const g=theoryGroups().find(x=>x.id===groupId);
  if(!g)return;
  const tm=tmap();
  document.getElementById('theoryModal')?.remove();
  const modal=document.createElement('div');
  modal.id='theoryModal';
  modal.style.cssText='position:fixed;inset:0;z-index:9999;background:rgba(15,23,42,.58);display:flex;align-items:center;justify-content:center;padding:18px';
  modal.innerHTML=`<section class="panel" style="width:min(900px,96vw);max-height:90vh;overflow:auto;box-shadow:0 24px 70px rgba(15,23,42,.28);padding:22px">
    <div style="display:flex;justify-content:space-between;gap:14px;align-items:flex-start">
      <div><span class="tag">LÝ THUYẾT</span><h2 style="margin:10px 0 6px">${g.title}</h2><p class="muted">${g.desc}</p></div>
      <button class="btn" id="closeTheory">Đóng ✕</button>
    </div>
    ${g.ids.map(id=>{
      const t=tm[id];
      return `<article style="padding:16px 0;border-top:1px solid var(--line)">
        <div class="tag">${t.type_id}</div>
        <h3 style="margin:10px 0 6px">${t.title}</h3>
        <p><b>Kiến thức cần nhớ:</b> ${mathSafe(t.core)}</p>
        <p><b>Nhận diện:</b> ${mathSafe(t.recognition)}</p>
        <h4>Cách làm</h4>
        <ol>${t.steps.map(x=>`<li>${mathSafe(x)}</li>`).join('')}</ol>
        <h4>Lỗi dễ sai</h4>
        <ul>${t.pitfalls.map(x=>`<li>${mathSafe(x)}</li>`).join('')}</ul>
        ${theoryExample(t.type_id)}
      </article>`;
    }).join('')}
  </section>`;
  document.body.appendChild(modal);
  by('closeTheory').onclick=()=>modal.remove();
  modal.addEventListener('click',e=>{if(e.target===modal)modal.remove()});
  typeset();
}
function home(){
  app.innerHTML=`<section class="hero">
    <h1>Ôn tập giữa học kỳ I<br>Toán 10</h1>
    <h3 style="margin:18px 0 10px;color:#d86500">Hướng dẫn sử dụng</h3>
    <div class="stats">
      <span class="stat">1. Chọn đề muốn làm</span>
      <span class="stat">2. Chọn Luyện tập hoặc Thi thử</span>
      <span class="stat">3. Làm bài và bấm Kiểm tra / Nộp bài</span>
      <span class="stat">4. Xem lời giải và ôn lại theo dạng bài</span>
    </div>
  </section>
  <h2 class="title">Chọn đề</h2>
  <section class="grid">${DATA.exams.map(e=>{const b=best(e.id);return `<article class="card"><div class="muted">TOÁN 10 · ${e.year}</div><h3>${e.title}</h3><div class="muted">12 trắc nghiệm · 5 tự luận</div><div class="actions"><button class="btn primary" data-start="${e.id}" data-mode="practice">Luyện tập</button><button class="btn" data-start="${e.id}" data-mode="exam">Thi thử</button></div>${b?`<p class="muted">Tốt nhất: ${b.correct}/12</p>`:''}</article>`}).join('')}</section>
  <h2 class="title">Lý thuyết cần nhớ</h2>
  <section class="grid">${theoryGroups().map(g=>`<article class="card"><span class="tag">LÝ THUYẾT</span><h3>${g.title}</h3><p>${g.desc}</p><div class="actions"><button class="btn primary" data-theory="${g.id}">Xem lý thuyết</button></div></article>`).join('')}</section>`;
  document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>start(b.dataset.start,b.dataset.mode));
  document.querySelectorAll('[data-theory]').forEach(b=>b.onclick=()=>openTheoryGroup(b.dataset.theory));
}
function start(id,mode){stop();state={view:'exam',exam:id,mode,answers:{},essay:{},submitted:false,sec:0,timer:null};setnav('');render();state.timer=setInterval(()=>{state.sec++;const e=by('timer');if(e)e.textContent=fmt(state.sec)},1000)}function fmt(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}function stop(){if(state.timer)clearInterval(state.timer);state.timer=null}
function diagram(id){if(!id)return'';if(id==='d3q6')return `<div class="diagram"><svg viewBox="0 0 520 300"><ellipse cx="260" cy="150" rx="185" ry="115" fill="#bfe7f2" stroke="#176b87" stroke-width="4"/><ellipse cx="285" cy="160" rx="82" ry="67" fill="#fff" stroke="#344054" stroke-width="4"/><text x="155" y="120" font-size="34">S</text><text x="270" y="170" font-size="34">T</text></svg></div>`;return `<div class="diagram"><svg viewBox="0 0 520 300"><line x1="45" y1="250" x2="490" y2="250" stroke="#222" stroke-width="3"/><line x1="110" y1="280" x2="110" y2="30" stroke="#222" stroke-width="3"/><line x1="100" y1="70" x2="430" y2="250" stroke="#176b87" stroke-width="4"/><text x="285" y="65" fill="#176b87" font-size="18">Đường biên và miền nghiệm</text></svg></div>`}
function note(q){const t=tmap()[q.type_id];const sourceText=q.id==='D1-TL-4'?'':q.source_issue;return `<details open><summary>${t.type_id} · ${t.title}</summary><div class="detail"><h4>Kiến thức cần nhớ</h4><div>${mathSafe(t.core)}</div><h4>Cách giải</h4><ol>${t.steps.map(x=>`<li>${x}</li>`).join('')}</ol><h4>Lỗi dễ sai</h4><ul>${t.pitfalls.map(x=>`<li>${x}</li>`).join('')}</ul><h4>Lời giải câu này</h4><div>${detailedSolution(q)}</div>${sourceText?`<p><b>Ghi chú:</b> ${sourceText}</p>`:''}</div></details>`}
function qhtml(q){const sel=state.answers[q.id],show=state.submitted||(state.mode==='practice'&&state['c_'+q.id]);return `<article class="q" id="${q.id}"><div class="qtop"><b>Câu ${q.number}</b><span class="tag">${q.type_id}</span></div><div class="prompt">${mathSafe(q.prompt)}</div>${diagram(q.diagram)}<div class="opts">${q.options.map(o=>`<label class="opt ${show&&o.label===q.answer?'correct':''} ${show&&sel===o.label&&sel!==q.answer?'wrong':''}"><input type="radio" name="${q.id}" value="${o.label}" ${sel===o.label?'checked':''} ${state.submitted?'disabled':''}><b>${o.label}.</b><span>${mathSafe(o.text)}</span></label>`).join('')}</div>${state.mode==='practice'&&!state.submitted?`<div class="actions"><button class="btn" data-check="${q.id}">Kiểm tra</button></div>`:''}${show?`<div class="feedback ${sel===q.answer?'good':'bad'}">${sel===q.answer?'✓ Chính xác':'✗ Chưa đúng'} · Đáp án <b>${mathSafe(q.answer)}</b></div>${note(q)}`:''}</article>`}
function ehtml(q){const show=state.submitted||state['s_'+q.id];return `<article class="q" id="${q.id}"><div class="qtop"><b>Bài ${q.number}</b><span class="tag">${q.type_id}</span></div><div class="prompt">${mathSafe(q.prompt)}</div><textarea data-essay="${q.id}" placeholder="Nhập các bước làm hoặc đáp án...">${state.essay[q.id]||''}</textarea><div class="actions"><button class="btn" data-sol="${q.id}">${show?'Ẩn':'Xem'} lời giải</button></div>${show?`<div class="feedback good"><b>Kết quả tham khảo:</b> ${mathSafe(q.answer)}</div>${note(q)}`:''}</article>`}
function exam(){const e=emap()[state.exam];let corr=0;if(state.submitted)e.mcq.forEach(q=>corr+=state.answers[q.id]===q.answer);app.innerHTML=`<div class="examhead"><div><div class="muted">TOÁN 10 · GHKI</div><h1>${e.title}</h1><span class="tag">${state.mode==='practice'?'Luyện tập':'Thi thử'}</span></div><div><span id="timer" class="tag">${fmt(state.sec)}</span> <button class="btn" id="home">← Trang chủ</button></div></div>${state.submitted?`<div class="score"><div class="muted">Kết quả trắc nghiệm</div><div class="scorebig">${(corr*.25).toFixed(2).replace('.',',')} / 3,00</div><div>${corr}/12 câu đúng</div></div>`:''}<h2 class="title">Phần I · Trắc nghiệm</h2>${e.mcq.map(qhtml).join('')}<h2 class="title">Phần II · Tự luận</h2>${e.essay.map(ehtml).join('')}<div class="actions"><button class="btn primary" id="submit">Nộp bài trắc nghiệm</button></div>`;document.querySelectorAll('input[type=radio]').forEach(r=>r.onchange=()=>state.answers[r.name]=r.value);document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{if(!state.answers[b.dataset.check])return alert('Hãy chọn đáp án.');state['c_'+b.dataset.check]=1;exam();typeset();by(b.dataset.check)?.scrollIntoView({block:'center'})});document.querySelectorAll('[data-essay]').forEach(t=>t.oninput=()=>state.essay[t.dataset.essay]=t.value);document.querySelectorAll('[data-sol]').forEach(b=>b.onclick=()=>{state['s_'+b.dataset.sol]=!state['s_'+b.dataset.sol];exam();typeset()});by('submit').onclick=submit;by('home').onclick=()=>{stop();state.view='home';state.exam=null;setnav('home');render()}}
function submit(){const e=emap()[state.exam];if(Object.keys(state.answers).length<12&&!confirm('Bạn chưa trả lời đủ 12 câu. Vẫn nộp?'))return;state.submitted=true;let correct=0;e.mcq.forEach(q=>correct+=state.answers[q.id]===q.answer);const s=store();s.attempts.push({examId:e.id,correct,seconds:state.sec,at:Date.now()});save(s);exam();typeset();scrollTo({top:0,behavior:'smooth'})}
function types(){
  const all=DATA.exams.flatMap(e=>[...e.mcq,...e.essay].map(q=>({...q,examId:e.id,examTitle:e.title})));
  app.innerHTML=`<h1>Ôn theo dạng bài</h1><p class="muted">Bấm “Xem dạng” để mở ngay kiến thức, cách giải và các câu luyện tương ứng.</p><section class="grid">${DATA.types.map(t=>`<article class="card"><span class="tag">${t.type_id}</span><h3>${t.title}</h3><p>${mathSafe(t.core)}</p><button class="btn" data-type="${t.type_id}">Xem dạng</button></article>`).join('')}</section>`;
  document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{
    const t=tmap()[b.dataset.type],qs=all.filter(q=>q.type_id===t.type_id);
    document.getElementById('typeModal')?.remove();
    const modal=document.createElement('div');
    modal.id='typeModal';
    modal.style.cssText='position:fixed;inset:0;z-index:9999;background:rgba(15,23,42,.58);display:flex;align-items:center;justify-content:center;padding:18px';
    modal.innerHTML=`<section class="panel" style="width:min(820px,96vw);max-height:88vh;overflow:auto;box-shadow:0 24px 70px rgba(15,23,42,.28);padding:22px">
      <div style="display:flex;justify-content:space-between;gap:14px;align-items:flex-start">
        <div><span class="tag">${t.type_id}</span><h2 style="margin:10px 0 6px">${t.title}</h2></div>
        <button class="btn" id="closeType" aria-label="Đóng">Đóng ✕</button>
      </div>
      <h4>Nhận diện dạng bài</h4><p>${mathSafe(t.recognition)}</p>
      <h4>Kiến thức cần nhớ</h4><p>${mathSafe(t.core)}</p>
      <h4>Cách giải</h4><ol>${t.steps.map(x=>`<li>${x}</li>`).join('')}</ol>
      <h4>Lỗi dễ sai</h4><ul>${t.pitfalls.map(x=>`<li>${x}</li>`).join('')}</ul>
      <h4>Luyện ngay trong 3 đề</h4>
      <div class="actions">${qs.map(q=>`<button class="btn primary" data-open="${q.examId}|${q.id}">${q.examTitle} · ${q.kind==='mcq'?'Câu':'Bài'} ${q.number}</button>`).join('')}</div>
    </section>`;
    document.body.appendChild(modal);
    by('closeType').onclick=()=>modal.remove();
    modal.addEventListener('click',ev=>{if(ev.target===modal)modal.remove()});
    document.querySelectorAll('#typeModal [data-open]').forEach(x=>x.onclick=()=>{
      const [id,qid]=x.dataset.open.split('|');
      modal.remove();
      start(id,'practice');
      setTimeout(()=>by(qid)?.scrollIntoView({behavior:'smooth',block:'center'}),120);
    });
    typeset();
  });
}
function results(){const a=store().attempts;if(!a.length){app.innerHTML='<h1>Kết quả học tập</h1><div class="panel">Chưa có lần nộp bài nào.</div>';return}app.innerHTML=`<h1>Kết quả học tập</h1><table><thead><tr><th>Đề</th><th>Tốt nhất</th><th>Điểm TN</th><th>Thời gian</th></tr></thead><tbody>${DATA.exams.map(e=>{const b=a.filter(x=>x.examId===e.id).sort((x,y)=>y.correct-x.correct)[0];return `<tr><td>${e.title}</td><td>${b?b.correct+'/12':'Chưa làm'}</td><td>${b?(b.correct*.25).toFixed(2)+'/3,00':'—'}</td><td>${b?fmt(b.seconds):'—'}</td></tr>`}).join('')}</tbody></table>`}
unpack().then(d=>{DATA=d;render()}).catch(e=>app.innerHTML='<div class="panel">Không tải được dữ liệu. Hãy dùng trình duyệt Chrome/Edge mới nhất.</div>');
</script></body></html>
